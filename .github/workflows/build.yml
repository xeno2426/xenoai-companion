name: Build XenoAI Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'firmware/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SKETCH_DIR: firmware/xenoai_firmware_v3
      SKETCH_NAME: xenoai_firmware_v3.ino
      FQBN: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=8M,PartitionScheme=default_8MB,CDCOnBoot=cdc,USBMode=hwcdc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7

      - name: Install Arduino libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SH110X"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "ArduinoJson"

      - name: Install FluxGarage RoboEyes (from GitHub)
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          cd "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/FluxGarage/RoboEyes.git FluxGarage_RoboEyes

      - name: Patch RoboEyes for SH1106G
        run: |
          LIB_DIR="$HOME/Arduino/libraries/FluxGarage_RoboEyes"
          HEADER=$(find "$LIB_DIR" -name "FluxGarage_RoboEyes.h" | head -n1)
          if [ -z "$HEADER" ]; then
            echo "ERROR: FluxGarage_RoboEyes.h not found"
            exit 1
          fi
          echo "Patching: $HEADER"
          sed -i 's|#include <Adafruit_SSD1306.h>|#include <Adafruit_SH110X.h>|g' "$HEADER"
          sed -i 's|extern Adafruit_SSD1306 display;|extern Adafruit_SH1106G display;|g' "$HEADER"
          echo "----- Patched header (top 30 lines) -----"
          head -n 30 "$HEADER"

      - name: Show library versions
        run: arduino-cli lib list

      - name: Compile sketch
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "$FQBN" \
            --build-path "$PWD/build" \
            --warnings default \
            --verbose \
            "$SKETCH_DIR"

      - name: List build outputs
        run: ls -la build/

      - name: Stage release artifacts
        run: |
          mkdir -p release
          cp "build/${SKETCH_NAME}.bin"           "release/${SKETCH_NAME}.bin"
          cp "build/${SKETCH_NAME}.elf"           "release/${SKETCH_NAME}.elf" || true
          cp "build/${SKETCH_NAME}.bootloader.bin" "release/${SKETCH_NAME}.bootloader.bin" || true
          cp "build/${SKETCH_NAME}.partitions.bin" "release/${SKETCH_NAME}.partitions.bin" || true
          ls -la release/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenoai_firmware_v3
          path: release/*
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          
